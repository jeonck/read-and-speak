baseURL = 'https://jeonck.github.io/read-and-speak/'
locale = 'en-us'
title = 'Read & Speak'
theme = 'PaperMod'
paginate = 10

[params]
  env = 'production'
  title = 'Read & Speak'
  description = 'Read a book, talk about it, and get better at English — one session at a time.'
  author = 'jeonck'
  defaultTheme = 'auto'
  disableThemeToggle = false
  ShowReadingTime = true
  ShowShareButtons = true
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = true
  ShowWordCount = true
  ShowRssButtonInSectionTermList = true
  UseHugoToc = true
  disableSpecial1stPost = false
  disableScrollToTop = false
  comments = false
  hidemeta = false
  hideSummary = false
  showtoc = false
  tocopen = false

  [params.homeInfoParams]
    Title = 'Read & Speak'
    Content = 'Book reading and speaking practice, reviewed session by session.'

  [[params.socialIcons]]
    name = 'github'
    url = 'https://github.com/jeonck/read-and-speak'

[menu]
  [[menu.main]]
    identifier = 'input'
    name = 'Add Session Transcript ✏️'
    url = 'https://github.com/jeonck/read-and-speak/edit/main/input/script.md'
    weight = 5
  [[menu.main]]
    identifier = 'posts'
    name = 'Posts'
    url = '/posts/'
    weight = 10
  [[menu.main]]
    identifier = 'tags'
    name = 'Tags'
    url = '/tags/'
    weight = 20
  [[menu.main]]
    identifier = 'search'
    name = 'Search'
    url = '/search/'
    weight = 30

[outputs]
  home = ['HTML', 'RSS', 'JSON']

# Quiz sections use raw HTML <details>/<summary> accordions in generated posts
[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
