baseURL = 'https://readandspeak.metacog.co.kr/'
locale = 'en-us'
title = 'Read & Speak'

[pagination]
  pagerSize = 10

[params]
  description = 'Read for 30 minutes, say it out loud, and get the English right — one session at a time.'
  author = 'jeonck'
  github = 'https://github.com/jeonck/read-and-speak'
  addSessionURL = 'https://github.com/jeonck/read-and-speak/edit/main/input/script.md'
  heroTitleLine1 = 'Read it.'
  heroTitleLine2 = 'Say it.'
  heroTitleLine3 = 'Say it better.'
  heroText = 'Every reading session, turned into a study post: your best sentences, natural corrections, and a quick quiz.'

[menu]
  [[menu.main]]
    identifier = 'posts'
    name = 'Sessions'
    url = '/posts/'
    weight = 10
  [[menu.main]]
    identifier = 'tags'
    name = 'Topics'
    url = '/tags/'
    weight = 20
  [[menu.main]]
    identifier = 'search'
    name = 'Search'
    url = '/search/'
    weight = 30

[taxonomies]
  tag = 'tags'

[outputs]
  home = ['HTML', 'RSS', 'JSON']

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      # raw <details> quiz toggles; hardWraps keeps the ❌/✅/💡 lines of "Say It Better" on separate lines
      unsafe = true
      hardWraps = true
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 2
